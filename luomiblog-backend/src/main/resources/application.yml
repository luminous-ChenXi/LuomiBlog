server:
  port: 8080

spring:
  application:
    name: luomiblog

  datasource:
    url: jdbc:mysql://localhost:3306/luomiblog?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
    # username: ${DB_USERNAME:}
    # password: ${DB_PASSWORD:}
    username: luomiblog
    password: 200300
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      # ORM 自动建表
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  sql:
    init:
      mode: never

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

logging:
  level:
    com.luomiblog: INFO
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"

jwt:
  secret: ${JWT_SECRET:luomiblog-secret-key-change-in-production}
  expiration: 86400000

app:
  registration-enabled: true
  cors:
    allowed-origins: http://localhost:4321,http://localhost:4322,http://localhost:3000,http://127.0.0.1:4321,http://127.0.0.1:4322,http://127.0.0.1:3000
  pagination:
    default-page-size: 10
    max-page-size: 100
