# LuomiBlog CI
# - backend:  JDK 21 + Maven 单元测试（纯单元测试，不依赖 MySQL，无数据库也可完整执行）
# - frontend: Node 20 + npm ci + Astro 构建（构建允许后端不在线）
# 仅质量门禁：不做部署、不发版。站长自建等价校验见 README「从源码到上线：CI/CD」。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Maven test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test (compile + unit tests, no database required)
        # 仓库未带 Maven Wrapper，使用 runner 预装的 Maven 3.9.x
        run: mvn -B -ntp test --file luomiblog-backend/pom.xml

  frontend:
    name: Frontend (Astro build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: luomiblog-frontend/package-lock.json

      - name: Install dependencies
        working-directory: luomiblog-frontend
        run: npm ci

      - name: Build
        working-directory: luomiblog-frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: luomiblog-frontend/dist/
          retention-days: 7
